<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="registration-card">

            <h1>Event Registration</h1>

            <p class="subtitle">
                Register for our upcoming event
            </p>

            <form id="registrationForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="college">College / Organization</label>
                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter college or organization"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="event">Select Event</label>

                    <select id="event" name="event" required>

                        <option value="">
                            Select an event
                        </option>

                        <option value="Hackathon">
                            Hackathon
                        </option>

                        <option value="Tech Workshop">
                            Tech Workshop
                        </option>

                        <option value="AI Seminar">
                            AI Seminar
                        </option>

                        <option value="Coding Contest">
                            Coding Contest
                        </option>

                    </select>
                </div>

                <button type="submit">
                    Register Now
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
